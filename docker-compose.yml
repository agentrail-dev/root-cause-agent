# Un seul conteneur : FastAPI (127.0.0.1:8000, interne) + Streamlit (8501, exposé).
# Les secrets (CLICKHOUSE_URL, OPENSEARCH_URL, POSTGRES_URL, ANTHROPIC_API_KEY) viennent
# de .env en local, ou des variables d'environnement configurées dans la console Aiven.
services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    ports: ["8501:8501"]
