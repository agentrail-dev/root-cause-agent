# Dev local : deux conteneurs séparés (l'image unique du Dockerfile sert à Aiven Runtime).
services:
  api:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
  frontend:
    build: .
    command: streamlit run frontend/app.py --server.port=8501 --server.address=0.0.0.0
    env_file: .env
    environment:
      BACKEND_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
