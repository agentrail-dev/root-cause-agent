<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RootCause — Agent d'incident</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c83ff'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo"></span><span>RootCause</span></div>
    <div class="side-label">Services surveillés <span id="svc-count"></span></div>
    <nav id="nav"></nav>
    <div class="side-foot" id="session"></div>
  </aside>
  <div class="main">
    <header class="top"><b>Agent d'incident</b><span class="sources">ClickHouse · OpenSearch · PostgreSQL</span>
      <div class="live" id="conn"><i></i><span>Connexion…</span></div></header>
    <main id="scroll"><div class="thread" id="thread"></div></main>
    <footer class="composer">
      <div class="chips" id="chips"></div>
      <form id="ask" class="cmd">
        <input id="question" autocomplete="off" placeholder="Demandez à l'agent… ex. Pourquoi le taux d'erreur a-t-il augmenté sur le paiement ?">
        <button class="send" type="submit" aria-label="Envoyer"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16V4M5 9l5-5 5 5"/></svg></button>
      </form>
    </footer>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
