<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RootCause — Agent d'incident</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c83ff'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo"></span><span>RootCause</span></div>
    <nav class="nav-top"><a class="svc" id="nav-home" href="#/"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="11" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="11" width="6" height="6" rx="1.5"/><rect x="11" y="11" width="6" height="6" rx="1.5"/></svg><span class="svc-name sans">Vue d'ensemble</span></a>
      <a class="svc" id="nav-alerts" href="#/alerts"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8a5 5 0 0 1 10 0c0 4 1.5 5 1.5 5h-13S5 12 5 8Z"/><path d="M8.5 16a1.6 1.6 0 0 0 3 0"/></svg><span class="svc-name sans">Alertes</span><span class="nbadge" id="alert-badge"></span></a>
      <a class="svc" id="nav-bench" href="#/benchmark"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16V9M10 16V4M16 16v-5"/></svg><span class="svc-name sans">Benchmark RCAEval</span></a></nav>
    <div class="side-label">Services surveillés <span id="svc-count"></span></div>
    <nav id="nav"></nav>
    <div class="side-foot" id="session"></div>
  </aside>
  <div class="center">
    <header class="top"><div class="crumbs" id="crumbs"></div><span class="sources">ClickHouse · OpenSearch · PostgreSQL</span>
      <div class="live" id="conn"><i></i><span>Connexion…</span></div>
      <button class="btn ghost agent-toggle" id="toggle-agent" title="Afficher / masquer l'agent (Ctrl+J)"><span class="avatar xs"></span>Agent</button></header>
    <main id="dash"></main>
  </div>
  <section class="agent" id="agent">
    <div class="agent-h"><span class="avatar sm"></span><div><b>Agent d'incident</b><small>Corrèle logs, traces et commandes</small></div>
      <button class="x" id="close-agent" aria-label="Fermer">×</button></div>
    <div class="agent-scroll" id="scroll"><div class="thread" id="thread"></div></div>
    <footer class="composer">
      <div class="chips" id="chips"></div>
      <form id="ask" class="cmd">
        <input id="question" autocomplete="off" placeholder="Demandez à l'agent…">
        <button class="send" type="submit" aria-label="Envoyer"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16V4M5 9l5-5 5 5"/></svg></button>
      </form>
    </footer>
  </section>
</div>
<script src="/app.js"></script>
</body>
</html>
